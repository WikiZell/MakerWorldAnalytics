[platformio]
default_envs = esp32-2432s028r
src_dir = src
include_dir = include
test_dir = test

[env]
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -D LV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -D MW_ANALYTICS_VERSION=\"0.1.0-alpha.1\"

[env:esp32-2432s028r]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
upload_speed = 921600
lib_deps =
  lvgl/lvgl@9.5.0
  lovyan03/LovyanGFX@1.2.7
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#26b691b2

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter = +<core/ProfileInput.cpp>
